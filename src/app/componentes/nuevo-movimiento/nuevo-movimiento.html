<!-- Agregamos shadow-sm a la tarjeta principal del formulario -->
<div class="card p-4 shadow-sm border-0">
    <h3 class="fs-5 fw-bold mb-3">Nuevo Movimiento</h3>
    
    <div class="mb-3">
        <label for="tipo" class="form-label">Tipo de movimiento</label>
        <select id="tipo" class="form-select" (change)="actualizarTipo($event)">
            <option value="Gasto" selected>Gasto</option>
            <option value="Recarga">Recarga</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="monto" class="form-label">Monto (S/)</label>
        <input type="number" id="monto" class="form-control" placeholder="0.00" 
               [value]="monto() || ''" (input)="actualizarMonto($event)">
    </div>

    @if (error()) {
        <div class="alert alert-danger py-2 fs-6 mt-2 mb-3">
            {{ error() }}
        </div>
    }

    <button class="btn btn-primary w-100" 
            [disabled]="esInvalido()" 
            (click)="registrarMovimiento()">
        Registrar movimiento
    </button>
</div>
